# ─── Server ──────────────────────────────────────────────────────────────────
server.port=${PORT:8080}


# ─── Application Name ─────────────────────────────────────────────────────────
spring.application.name=elevator-dispatch-system

# ─── Logging ──────────────────────────────────────────────────────────────────
# Show INFO-level logs from our own packages for visibility during development
logging.level.com.elevator=INFO
logging.level.org.springframework.web.socket=WARN

# ─── Jackson JSON ─────────────────────────────────────────────────────────────
# Serialize enums as strings (not ordinals) for readability in WebSocket messages
spring.jackson.serialization.write-enums-using-to-string=true
# Exclude null fields from JSON output (cleaner payloads)
spring.jackson.default-property-inclusion=non_null

# ─── CORS (for local development) ─────────────────────────────────────────────
# Frontend runs on Vite dev server at port 5173
# This is configured in WebSocketConfig.java for WebSocket
# For REST endpoints, add a @CrossOrigin annotation or a CorsFilter bean

# ─── Async / Thread Pool ──────────────────────────────────────────────────────
# The @Scheduled simulation tick runs on Spring's task scheduler.
# We don't need custom pool config for now; Spring defaults to 1 scheduled thread.
spring.task.scheduling.pool.size=2
